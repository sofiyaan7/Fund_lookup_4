# Netlify build configuration.
# Used when the site is built by Netlify (Git-connected deploys or
# `netlify deploy --build`). It does NOT apply to manual drag-and-drop
# "Netlify Drop" uploads — for those, drop the built `dist/` folder.

[build]
  # Netlify installs dependencies and runs this in the cloud.
  command = "npm run build"
  # The folder Vite outputs static files to — this is what gets served.
  publish = "dist"

[build.environment]
  # Pin Node so cloud builds match local.
  NODE_VERSION = "20"

[functions]
  # Serverless functions live here; nifty-history.js answers
  # /api/nifty-history (see its own `config.path`), matching the Vercel
  # function and the Vite dev middleware.
  directory = "netlify/functions"

# SPA fallback: serve index.html for any path that isn't a real file.
# Deep links like /fund/<Scheme%20Name> and /manager/<Name> are client-side
# routes, so they must all resolve to the app shell.
#
# `force = false` (the default) means real files and function routes win, so
# this does NOT swallow /api/*.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
